<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    (function () {
      var saved = localStorage.getItem("kaia-theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.dataset.theme = saved;
      } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>
  <title>Knowledge Gardener</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌱</text></svg>" />
  <meta name="description" content="질문에는 코퍼스를 찾아 답하고, 오늘 배운 걸 들려주면 학습일지로 남기는 개인 학습 에이전트" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
  <main class="page">
    <header class="head">
      <div class="head-top">
        <div>
          <p class="eyebrow">Knowledge Gardener</p>
          <h1 class="title">질문하고, 기록하는 곳</h1>
        </div>
        <div class="head-actions">
          <button type="button" class="theme-toggle-btn" id="theme-toggle-btn" aria-pressed="false">
            <span id="theme-toggle-label">다크로</span>
          </button>
          <button type="button" class="new-thread-btn" id="new-thread-btn">새 대화</button>
        </div>
      </div>
      <p class="sub">
        궁금한 걸 물으면 문서를 찾아 답하고, 오늘 배운 걸 들려주면 학습일지로 만듭니다.
      </p>
      <p class="corpus-note" id="corpus-note" hidden></p>
    </header>

    <div class="thread" id="thread"></div>

    <div class="flow" id="flow" aria-hidden="true">
      <div class="flow-line"></div>
      <div class="flow-dot"></div>
    </div>

    <p class="status" id="status" hidden>
      <span id="status-text">생각하는 중</span><span class="dots"><span></span><span></span><span></span></span>
    </p>

    <section class="state-panel" id="state-panel" hidden>
      <h2 class="label" id="state-label">no match</h2>
      <p class="state-text" id="state-text"></p>
    </section>

    <div class="composer">
      <div class="examples" id="examples" role="group" aria-label="질문 예시" hidden></div>

      <form id="ask-form" class="prompt-bar" autocomplete="off">
        <label class="sr-only" for="question">질문 입력</label>
        <span class="prompt-caret" aria-hidden="true">&gt;</span>
        <input id="question" name="question" type="text" placeholder="질문하거나, 오늘 배운 걸 이야기해보세요" required />
        <button type="submit" id="submit-btn" aria-label="질문하기">↵</button>
      </form>
    </div>

    <template id="turn-template">
      <div class="turn">
        <div class="turn-user">
          <p class="turn-question"></p>
        </div>
        <div class="turn-agent">
          <div class="sources"></div>
          <div class="answer"></div>
        </div>
      </div>
    </template>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="/app.js"></script>
</body>

</html>
